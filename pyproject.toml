[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not lento'"
markers = [
    "insumos: depende dos insumos reais em exemplo_input/ (pulado se ausentes)",
    "lento: leva mais de alguns segundos",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["censo_etl", "conftest", "comparacao"]
